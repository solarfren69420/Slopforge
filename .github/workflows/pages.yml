name: Build and deploy Slopforge
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Load latest upstream observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance.py fetch-state
      - name: Validate catalog and build static site
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py --update-docs
          node --check web/app.js
          git diff --exit-code -- README.md CATALOG.md web/assets/cards
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test the built storefront in Chromium
        env:
          SLOPFORGE_URL: http://127.0.0.1:8080/
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site > /tmp/slopforge-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 scripts/wait_for_server.py http://127.0.0.1:8080/
          npm run test:browser
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/*.png
            /tmp/slopforge-server.log
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
